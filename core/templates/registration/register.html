{% extends 'base_auth.html' %}

{% block title %}Регистрация{% endblock %}

{% block content %}
<section class="auth-page">
    <div class="auth-card">
        <h1 class="auth-title">Регистрация</h1>

        <form class="auth-form" method="post">
            {% csrf_token %}

            <input type="text" name="username" placeholder="Логин" class="auth-input">
            <input type="text" name="first_name" placeholder="Имя" class="auth-input">
            <input type="text" name="last_name" placeholder="Фамилия" class="auth-input">
            <input type="password" name="password" placeholder="Пароль" class="auth-input">

            <button type="submit" class="auth-button">
                Регистрация
            </button>
        </form>

        <p class="auth-footer">
            Уже есть аккаунт?
            <a href="{% url 'login' %}" class="auth-link">Войти</a>
        </p>
    </div>
</section>
{% endblock %}
