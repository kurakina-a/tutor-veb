{% load static %}
<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Сайт для репетиторов{% endblock %}</title>
    <link rel="stylesheet" href="{% static 'css/style.css' %}">
</head>
<body>
    <header class="site-header">
        <div class="container header-inner">
            <a href="{% url 'home' %}" class="logo">TutorPlatform</a>

            <nav class="nav">
                <a href="{% url 'home' %}">Главная</a>
                <a href="{% url 'login' %}">Вход</a>
                <a href="{% url 'register' %}">Регистрация</a>
                <a href="{% url 'teacher_dashboard' %}">Преподаватель</a>
                <a href="{% url 'student_dashboard' %}">Ученик</a>
                <a href="{% url 'tests_list' %}">Тесты</a>
            </nav>
        </div>
    </header>

    <main class="container">
        {% block content %}
        {% endblock %}
    </main>
</body>
</html>
