{% extends 'base_auth.html' %}

{% block title %}Добавить ученика{% endblock %}

{% block content %}
<section style="min-height: 100vh; background: #d8f0d7; padding: 48px 24px 80px;">
    <div style="width: 100%; max-width: 560px; margin: 0 auto;">

        <h1 style="margin: 0 0 28px; font-size: 32px; font-weight: 700; color: #204320; text-align: center;">
            Добавить ученика
        </h1>

        {% if error %}
            <div style="background: #eaf8e8; border-radius: 14px; padding: 14px 18px; margin-bottom: 16px; font-size: 15px; font-weight: 700; color: #b03030; box-shadow: 0 6px 14px rgba(74, 120, 74, 0.06);">
                {{ error }}
            </div>
        {% endif %}

        {% if success %}
            <div style="background: #eaf8e8; border-radius: 14px; padding: 14px 18px; margin-bottom: 16px; font-size: 15px; font-weight: 700; color: #2e7d32; box-shadow: 0 6px 14px rgba(74, 120, 74, 0.06);">
                {{ success }}
            </div>
        {% endif %}

        <form method="post" style="background: #eaf8e8; border-radius: 20px; padding: 32px 28px; box-shadow: 0 10px 24px rgba(74, 120, 74, 0.08);">
            {% csrf_token %}

            <label style="display: block; font-size: 16px; font-weight: 700; margin-bottom: 8px; color: #204320;">
                Логин ученика
            </label>

            <input
                type="text"
                name="username"
                placeholder="Введите логин"
                value="{{ username_value }}"
                style="width: 100%; box-sizing: border-box; height: 44px; border: none; outline: none; border-radius: 12px; background: #edf8e8; padding: 0 14px; margin-bottom: 20px; font-size: 16px; color: #244224;"
            >

            <button type="submit" style="width: 100%; height: 48px; border: none; border-radius: 14px; background: #49b347; color: white; font-size: 16px; font-weight: 700; cursor: pointer;">
                Добавить
            </button>
        </form>

        <a href="{% url 'my_students' %}" style="display: inline-flex; margin-top: 22px; color: #264726; text-decoration: none; font-size: 16px; font-weight: 700;">
            Назад к ученикам
        </a>

    </div>
</section>
{% endblock %}
