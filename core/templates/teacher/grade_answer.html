<h1>Оценка ответа</h1>

<p><strong>Ученик:</strong> {{ answer.student.first_name }} {{ answer.student.last_name }}</p>
<p><strong>Тест:</strong> {{ answer.test.title }}</p>
<p><strong>Вопрос:</strong> {{ answer.question.text }}</p>
<p><strong>Ответ ученика:</strong></p>
<p style="background: #f5f5f5; padding: 10px;">{{ answer.answer_text }}</p>

<form method="post">
    {% csrf_token %}
    <label>Оценка (баллы):</label>
    <input type="number" name="score" min="0" required>
    <button type="submit">Сохранить</button>
</form>

<a href="{% url 'review_text_answers' %}">Назад</a>
