<h1>Мои тесты</h1>

{% for assigned in assigned_tests %}
<div>
    <strong>{{ assigned.test.title }}</strong><br>
    {% if assigned.deadline %}
        Дедлайн: {{ assigned.deadline|date:"d.m.Y H:i" }}
    {% else %}
        Дедлайн не установлен
    {% endif %}
    <br>
    <a href="{% url 'take_test' assigned.test.id %}">▶ Пройти тест</a>
</div>
{% empty %}
<p>Вам пока не назначено ни одного теста</p>
{% endfor %}
