{% extends 'base_auth.html' %}

{% block title %}Профиль преподавателя{% endblock %}

{% block content %}
<section style="min-height: 100vh; background: #d8f0d7; padding: 48px 24px 80px;">
    <div style="width: 100%; max-width: 1080px; margin: 0 auto;">

        <div style="display: flex; justify-content: space-between; align-items: flex-start; gap: 20px; margin-bottom: 28px;">
            <h1 style="margin: 0; font-size: 32px; font-weight: 700; color: #204320;">Логин</h1>

            <a href="{% url 'home' %}" style="margin-top: 16px; display: inline-flex; align-items: center; justify-content: center; min-width: 102px; height: 44px; padding: 0 22px; border-radius: 14px; background: #edf8e8; color: #264726; text-decoration: none; font-size: 18px; font-weight: 600; box-shadow: 0 4px 12px rgba(68, 102, 68, 0.08);">
                Выйти
            </a>
        </div>

        <div style="display: flex; align-items: center; gap: 36px; margin-bottom: 14px;">
            <a href="{% url 'teacher_dashboard' %}" style="position: relative; text-decoration: none; font-size: 18px; font-weight: 700; color: #204320; padding-bottom: 8px; border-bottom: 3px solid #204320;">
                Профиль
            </a>

            <a href="{% url 'tests_list' %}" style="text-decoration: none; font-size: 18px; font-weight: 500; color: #355535; padding-bottom: 8px;">
                Тесты
            </a>

            <a href="{% url 'teacher_checking' 1 %}" style="text-decoration: none; font-size: 18px; font-weight: 500; color: #355535; padding-bottom: 8px;">
                Мои ученики
            </a>
        </div>

        <div style="width: 100%; height: 2px; background: #d9ead3; margin-bottom: 34px;"></div>

        <div style="background: #eaf8e8; border-radius: 20px; padding: 34px 38px 36px; box-shadow: 0 10px 24px rgba(74, 120, 74, 0.08);">
            <h2 style="margin: 0 0 28px; font-size: 22px; font-weight: 700; color: #244224;">
                Информация о пользователе
            </h2>

            <div style="display: flex; flex-direction: column; gap: 22px;">
                <p style="margin: 0; font-size: 18px; color: #6e6e6e;"><span style="font-weight: 500; color: #5e5e5e;">Имя:</span> —</p>
                <p style="margin: 0; font-size: 18px; color: #6e6e6e;"><span style="font-weight: 500; color: #5e5e5e;">Фамилия:</span> —</p>
                <p style="margin: 0; font-size: 18px; color: #6e6e6e;"><span style="font-weight: 500; color: #5e5e5e;">Логин:</span> Логин</p>
                <p style="margin: 0; font-size: 18px; color: #6e6e6e;"><span style="font-weight: 500; color: #5e5e5e;">Роль:</span> Преподаватель</p>
            </div>
        </div>

    </div>
</section>
{% endblock %}
