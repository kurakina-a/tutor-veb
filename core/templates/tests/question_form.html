{% extends 'base_auth.html' %}

{% block title %}{{ title }}{% endblock %}

{% block content %}
<section style="min-height: 100vh; background: #d8f0d7; padding: 36px 20px;">
    <div style="max-width: 560px; margin: 0 auto;">

        <div style="
            background: #eef7ea;
            border-radius: 20px;
            box-shadow: 0 8px 20px rgba(0,0,0,0.08);
            padding: 28px 26px;
        ">

            <a href="{% url 'test_edit' test.id %}" style="
                display: inline-block;
                margin-bottom: 18px;
                padding: 8px 14px;
                border-radius: 12px;
                border: 2px solid #154f14;
                background: #fff;
                color: #154f14;
                text-decoration: none;
                font-weight: 700;
                font-size: 15px;
            ">
                ← Назад
            </a>

            <h1 style="
                margin: 0 0 22px 0;
                font-size: 32px;
                line-height: 1.15;
                color: #234b23;
                font-weight: 800;
            ">
                {{ title }}
            </h1>

            <form method="post" style="display: flex; flex-direction: column; gap: 16px;">
                {% csrf_token %}

                <div>
                    <label for="{{ form.text.id_for_label }}" style="
                        display: block;
                        margin-bottom: 8px;
                        color: #234b23;
                        font-size: 16px;
                        font-weight: 700;
                    ">
                        Текст вопроса
                    </label>
                    {{ form.text }}
                </div>

                <div>
                    <label for="{{ form.question_type.id_for_label }}" style="
                        display: block;
                        margin-bottom: 8px;
                        color: #234b23;
                        font-size: 16px;
                        font-weight: 700;
                    ">
                        Тип вопроса
                    </label>
                    {{ form.question_type }}
                </div>

                <div>
                    <label for="{{ form.order.id_for_label }}" style="
                        display: block;
                        margin-bottom: 8px;
                        color: #234b23;
                        font-size: 16px;
                        font-weight: 700;
                    ">
                        Порядок
                    </label>
                    {{ form.order }}
                </div>

                <button type="submit" style="
                    margin-top: 4px;
                    height: 48px;
                    border-radius: 14px;
                    border: none;
                    background: #154f14;
                    color: #fff;
                    font-size: 17px;
                    font-weight: 800;
                    cursor: pointer;
                ">
                    Сохранить
                </button>
            </form>
        </div>
    </div>
</section>

<style>
    #id_text,
    #id_question_type,
    #id_order {
        width: 100%;
        box-sizing: border-box;
        border: 2px solid #d7e6d2;
        background: #f8fff7;
        border-radius: 14px;
        padding: 12px 14px;
        font-size: 16px;
        color: #234b23;
        outline: none;
    }

    #id_text {
        min-height: 110px;
        resize: vertical;
    }

    #id_question_type,
    #id_order {
        height: 46px;
    }

    #id_text:focus,
    #id_question_type:focus,
    #id_order:focus {
        border-color: #56b947;
        box-shadow: 0 0 0 4px rgba(86, 185, 71, 0.12);
    }
</style>
{% endblock %}
