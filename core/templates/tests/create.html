{% extends 'base_auth.html' %}

{% block title %}Создать новый тест{% endblock %}

{% block content %}
<section style="min-height: 100vh; background: #d8f0d7; padding: 48px 24px;">
    <div style="max-width: 700px; margin: 0 auto;">

        <div style="
            background: #eaf8e8;
            padding: 30px;
            border-radius: 20px;
            box-shadow: 0 6px 16px rgba(0,0,0,0.08);
        ">

            <a href="{% url 'test_list' %}" style="
                display: inline-block;
                margin-bottom: 20px;
                padding: 8px 14px;
                border-radius: 10px;
                border: 2px solid #154f14;
                background: #fff;
                color: #154f14;
                text-decoration: none;
                font-weight: 600;
            ">
                ← Отмена
            </a>

            <h1 style="color: #234b23; margin-bottom: 24px;">
                Создать новый тест
            </h1>

            <form method="post" style="display: flex; flex-direction: column; gap: 16px;">
                {% csrf_token %}

                {{ form.as_p }}

                <button type="submit" style="
                    margin-top: 10px;
                    height: 50px;
                    border-radius: 14px;
                    border: none;
                    background: #154f14;
                    color: #fff;
                    font-size: 16px;
                    font-weight: 700;
                    cursor: pointer;
                ">
                    Создать тест
                </button>
            </form>

        </div>

    </div>
</section>
{% endblock %}
